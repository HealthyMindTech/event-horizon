[package]
name = "test_clustering_robustness"
version = "0.1.0"
edition = "2021"

[dependencies]
# Command-line argument parsing
clap = { version = "4.5", features = ["derive"] }

# YAML configuration parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# CSV writing
csv = "1.3"

# Numerical operations
ndarray = "0.15"
ndarray-stats = "0.5"

# Clustering - using linfa for DBSCAN
linfa = "0.7"
linfa-clustering = "0.7"

# Memory-mapped file I/O
memmap2 = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Image processing for frame generation
image = "0.25"
imageproc = "0.25"
rusttype = "0.9"

[[bin]]
name = "test_clustering_robustness"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "create_tracking_video"
path = "src/bin/create_tracking_video.rs"
