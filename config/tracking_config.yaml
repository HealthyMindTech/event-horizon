# Blade Tracking Configuration
# Parameters for temporal propeller blade detection and tracking

# Data source configuration
data:
  # Input file (relative to project root or absolute path)
  input_file: "drone_idle.dat"

  # Camera resolution
  width: 1280
  height: 720

  # Time range to analyze
  start_time_sec: 5.0 # Start time in seconds from beginning of recording
  duration_sec: 0.1 # Duration to process in seconds (100ms) - longer to capture sparse propellers

  # Polarity to analyze (-1 for negative, 1 for positive, null for both)
  polarity: -1

# Hot pixel filtering
hot_pixel:
  # Threshold for considering a pixel location as "hot" (too many events at exact same coord)
  threshold: 100

# Clustering parameters
clustering:
  # Initial clustering (DBSCAN for first window)
  initial:
    eps: 6 # Maximum distance between points in a cluster (pixels)
    min_samples: 10 # Minimum number of events to form a cluster
    window_us: 20000 # Duration of initial window in microseconds (20ms)
    min_cluster_events: 300 # Minimum events per cluster to be considered valid
    max_y_spread: 5.0 # Maximum y-axis spread (std dev) to filter out diffuse clusters

  # Temporal tracking
  temporal:
    assignment_distance: 15 # Maximum distance to assign event to existing cluster (pixels)
    min_cluster_size: 8 # Minimum events per cluster to keep it active
    window_duration_us: 750 # Rolling window duration in microseconds (0.75ms)
    grace_period_us: 5000 # Time to keep cluster alive even with sparse events (5ms)
    reinit_interval_us: 2000 # How often to re-run DBSCAN to detect new clusters (2ms)
    min_events_for_reinit: 50 # Minimum unclustered events needed to trigger re-initialization

# Region of interest (ROI)
roi:
  # Margin to add around detected clusters (pixels)
  margin: 50

  # Manual ROI override (set to null to auto-detect from clusters)
  # Format: [x_min, x_max, y_min, y_max]
  manual: null

# Video generation
video:
  # Output video file
  output_file: "blade_tracking_video.mp4"

  # Video parameters
  fps: 30
  width: 1920
  height: 1080
  codec: "mp4v"

  # How often to render frames (1 = every event, higher = skip events)
  # Will be auto-calculated to generate ~10 seconds of video if null
  frame_interval: null

  # Visualization style
  visualization:
    background_color: "black"
    event_size: 8 # Size of event dots
    event_alpha: 0.7 # Transparency of events (0-1)
    unclustered_color: "white" # Color for events not in any cluster
    unclustered_size: 4 # Size of unclustered event dots
    unclustered_alpha: 1 # Transparency of unclustered events (0-1)
    center_color: "red"
    center_size: 3 # Radius of cluster center marker
    line_color: "white"
    line_width: 2.5
    line_style: "dashed"
    label_color: "yellow"
    label_fontsize: 9
    grid_alpha: 0.2
    grid_color: "gray"

# Dataset-specific presets
presets:
  drone_idle:
    data:
      input_file: "drone_idle.dat"
      start_time_sec: 4.0 # Start earlier to catch propellers that might appear later
      duration_sec: 0.06 # Reduced by 70% from 0.2s
      polarity: -1
    hot_pixel:
      threshold: 100
    clustering:
      initial:
        eps: 2
        min_samples: 5
        window_us: 10000
        min_cluster_events: 100
        max_y_spread: 5.0
      temporal:
        assignment_distance: 10
        min_cluster_size: 5 # Lower threshold to keep sparse propellers
        window_duration_us: 500 # Optimized for RPM stability (0.5ms rolling window)
        grace_period_us: 20000 # Very long grace period for sparse drone propeller data (20ms)
        reinit_interval_us: 10000 # Check for new propellers every 10ms
        min_events_for_reinit: 50 # Lower threshold but with longer reinit interval
    roi:
      margin: 50

  drone_moving:
    data:
      input_file: "drone_moving.dat"
      start_time_sec: 1.0
      duration_sec: 0.1
      polarity: -1
    hot_pixel:
      threshold: 150
    clustering:
      initial:
        eps: 3
        min_samples: 8
        window_us: 15000
        min_cluster_events: 150
        max_y_spread: 5.0
      temporal:
        assignment_distance: 12
        min_cluster_size: 6
        window_duration_us: 750
        grace_period_us: 10000
        reinit_interval_us: 5000
        min_events_for_reinit: 60
    roi:
      margin: 60
